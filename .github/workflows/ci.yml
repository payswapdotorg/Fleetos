name: CI

on:
  push:
    branches: ain]
  pull_request:
    branches: ain]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"
      - run: bun install
      - run: bun run check
      - run: bun run typecheck
      - run: bun test
      # W092 [TL]: the console production build + the deployment
      # manifest digest (the Vercel staging build evidence).
      - run: bun run build
        working-directory: apps/web
      - run: node tools/deployment-manifest.mjs --env staging
